<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Vòng hào quang đa sắc Gradient -->
    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#FF007A"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2b5c"/>
      <stop offset="60%" stop-color="#141e46"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="60%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFCC80"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0077FF"/>
      <stop offset="100%" stop-color="#7B1FA2"/>
    </linearGradient>
    <linearGradient id="headphoneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#00F5FF" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Viền kim loại công nghệ tương lai -->
  <circle cx="24" cy="24" r="22.5" fill="url(#badgeBg)" stroke="url(#badgeBorder)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Thân áo phi hành gia / học sinh công nghệ -->
  <path d="M12 43 C12 34 16 31 24 31 C32 31 36 34 36 43 Z" fill="url(#suitGrad)" stroke="#FFFFFF" stroke-width="0.8"/>
  <path d="M20 31 L24 35 L28 31 Z" fill="#FFD700"/>

  <!-- Cổ áo -->
  <rect x="21" y="27" width="6" height="5" rx="2" fill="url(#faceGrad)"/>

  <!-- Khuôn mặt -->
  <ellipse cx="24" cy="21.5" rx="8.5" ry="8" fill="url(#faceGrad)"/>

  <!-- Má hồng đáng yêu -->
  <ellipse cx="18.5" cy="23.5" rx="1.8" ry="1.1" fill="#FF5252" opacity="0.6"/>
  <ellipse cx="29.5" cy="23.5" rx="1.8" ry="1.1" fill="#FF5252" opacity="0.6"/>

  <!-- Đôi mắt sáng ngời -->
  <ellipse cx="20.5" cy="21" rx="1.5" ry="1.8" fill="#1A237E"/>
  <circle cx="20" cy="20.3" r="0.6" fill="#FFFFFF"/>
  <ellipse cx="27.5" cy="21" rx="1.5" ry="1.8" fill="#1A237E"/>
  <circle cx="27" cy="20.3" r="0.6" fill="#FFFFFF"/>

  <!-- Nụ cười tự tin -->
  <path d="M22 24 Q24 26 26 24" stroke="#BF360C" stroke-width="1.1" stroke-linecap="round" fill="none"/>

  <!-- Mái tóc phiêu lưu màu cam vàng -->
  <path d="M16 19 C15 13 19 11 24 11 C29 11 33 13 32 19 C31 16 28 14 24 14 C20 14 17 16 16 19 Z" fill="url(#hairGrad)"/>
  <path d="M19 14 C21 12 24 12 26 14 C24 12.5 22 12.5 19 14 Z" fill="#FFE082"/>

  <!-- Tai nghe Gaming Cyberphone nổi bật -->
  <path d="M14.5 21 C14.5 14 18 10 24 10 C30 10 33.5 14 33.5 21" fill="none" stroke="url(#headphoneGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Đệm tai trái & phải phát sáng -->
  <rect x="12.5" y="19" width="3.2" height="6.5" rx="1.6" fill="#00E5FF" stroke="#FFFFFF" stroke-width="0.8"/>
  <rect x="32.3" y="19" width="3.2" height="6.5" rx="1.6" fill="#FF007A" stroke="#FFFFFF" stroke-width="0.8"/>

  <!-- Ngôi sao lấp lánh (Sparkle Star) -->
  <path d="M38 5 L39.3 8.7 L43 10 L39.3 11.3 L38 15 L36.7 11.3 L33 10 L36.7 8.7 Z" fill="url(#starGrad)" stroke="#FF8F00" stroke-width="0.5"/>
</svg>

