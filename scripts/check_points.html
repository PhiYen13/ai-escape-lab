<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;background:#000;">
<canvas id="c" width="1672" height="941" style="display:block;"></canvas>
<script>
window.onload = () => {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0);

    function mark(x, y, label, col='red') {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(x, y, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText(label + ` (${x},${y})`, x + 15, y + 5);
    }

    mark(420, 640, 'Pt A', 'cyan');
    mark(700, 640, 'Pt B', 'yellow');
    mark(270, 595, 'Tr1', 'magenta');
    mark(335, 275, 'Tr2', 'orange');
    mark(880, 415, 'Tr3_desk', 'lime');
    mark(1040, 400, 'Tr3_hex', 'green');
    mark(970, 845, 'Tr4_desk', 'blue');
    mark(1180, 830, 'Tr4_room', 'lightblue');
    mark(1410, 175, 'Door', 'red');

    document.title = 'CHECK_POINTS_DONE';
  };
  img.src = '/assets/room3_4/nen_room.png';
};
</script>
</body>
</html>
