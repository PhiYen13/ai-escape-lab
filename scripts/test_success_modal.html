<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="http://localhost:3000/style.css">
  <style>
    body { margin: 0; background: #07152b; font-family: system-ui, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div class="r3g4-modal" style="width: min(780px, 95vw);">
    <div style="padding:4px 6px;">
      <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #e2e8f0;padding-bottom:8px;margin-bottom:8px;">
        <div>
          <h3 style="color:#1e3a8a;margin:0;font-size:16px;font-weight:800;">📁 Kho dữ liệu</h3>
          <span style="font-size:12px;color:#059669;font-weight:700;">Câu 1/5: <b>Chính xác!</b></span>
        </div>
        <button class="r3g4-btn" type="button" style="padding:5px 12px;font-size:12px;">✕ Đóng</button>
      </div>

      <div class="r3g4-progress" style="height:6px;background:#e2e8f0;border-radius:10px;overflow:hidden;margin-bottom:12px;">
        <div style="width:20%;height:100%;background:linear-gradient(90deg, #38bdf8, #10b981);"></div>
      </div>

      <div class="r3g4-feedback-card correct" style="margin-top:6px;padding:14px 16px;">
        <div class="r3g4-feedback-mascot" style="width:52px;height:52px;">
          <img src="http://localhost:3000/assets/mascot/05_chuc_mung.png" alt="Én Én chúc mừng">
        </div>
        <div class="r3g4-feedback-text">
          <div style="font-size:14px;color:#059669;font-weight:900;text-transform:uppercase;margin-bottom:4px;">🎉 CHÍNH XÁC!</div>
          <div style="font-size:15px;line-height:1.5;">Chúc mừng em đã phân loại chính xác cả 5 dạng thông tin trên trang Đêm hội Trung thu!</div>
        </div>
      </div>

      <button class="r3g4-btn gold" type="button" style="width:100%;margin-top:14px;padding:12px;font-size:16px;font-weight:800;">
        CÂU TIẾP THEO ➔
      </button>
    </div>
  </div>
</body>
</html>
