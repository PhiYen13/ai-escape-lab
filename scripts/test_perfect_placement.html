<!doctype html>
<html>
<head><meta charset="utf-8"></head>
<body style="margin:0;background:#000;">
<canvas id="c" width="1672" height="941" style="display:block;"></canvas>
<script>
window.onload = async () => {
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');

  const load = src => new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = () => reject(new Error('Failed ' + src));
    im.src = src;
  });

  const bg = await load('/assets/room3_4/nen_room.png');
  ctx.drawImage(bg, 0, 0);

  const t1 = await load('/assets/room3_4/tram1.png');
  const t2 = await load('/assets/room3_4/tram2.png');
  const t3 = await load('/assets/room3_4/tram3.png');
  const t4 = await load('/assets/room3_4/tram4.png');
  const door = await load('/assets/room3_4/cua_khoa.png');

  // Let's place all 4 stations and the door:
  // Trạm 2 – Bộ điều khiển liên kết: khoang trên bên trái (center 400, 240)
  // Desk width ~260, height ~173
  ctx.drawImage(t2, 400 - 130, 240 - 110, 260, 173);

  // Trạm 1 – Kho dữ liệu: khoang giữa bên trái (center 330, 560)
  ctx.drawImage(t1, 330 - 130, 560 - 110, 260, 173);

  // Trạm 3 – Hệ thống bảo mật: khoang phía trên bên phải, bên trái hành lang dẫn lên cửa thoát (center 1040, 380)
  ctx.drawImage(t3, 1040 - 130, 380 - 110, 260, 173);

  // Trạm 4 – Kho tri thức: khoang dưới bên phải (center 1150, 810)
  ctx.drawImage(t4, 1150 - 130, 810 - 110, 260, 173);

  // Cửa thoát: hốc trên cùng bên phải (1410, 160)
  // naturalW: 1448, naturalH: 1086 -> 260 x 195
  ctx.drawImage(door, 1410 - 130, 160 - 100, 260, 195);

  document.title = 'PERFECT_PLACEMENTS';
};
</script>
</body>
</html>
